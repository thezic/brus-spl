<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` non-zero, which the screen's
         top and bottom padding depend on. `user-scalable=no` because a pinch-zoomed meter at a
         venue is a meter you cannot read, and because it stops iOS zooming the page when the
         calibration fields take focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0c" />
    <title>Decibel Meter</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
