[package]
name = "decibel-meter"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "decibel_meter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.1"
# The bounded lock-free SPSC queue out of the audio callback (spec §16.2). Small and
# purpose-built for exactly this boundary; hand-rolling one correctly is not a
# 15-line job the way the biquad recursion is.
rtrb = "0.3"

# iOS-only: configure the AVAudioSession that cpal deliberately does not touch.
# Version and feature set deliberately match cpal's own iOS dependency so the
# objc2 graph does not duplicate.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "AVAudioSession",
    "AVAudioSessionTypes",
    "block2",
] }
block2 = "0.6"
# For `runtime::Bool` in the requestRecordPermission completion block. Range
# matches objc2-avf-audio's own constraint so the objc2 graph does not duplicate.
objc2 = { version = ">=0.6.2, <0.8.0", default-features = false, features = ["std"] }
# For `UIApplication.isIdleTimerDisabled` (spec §4.4). Needs no `bundle.iOS.frameworks`
# entry and no project regeneration — UIKit is already in Tauri's hardcoded list.
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "UIApplication",
    "UIResponder",
] }

